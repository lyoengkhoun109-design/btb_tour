
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camping Places</title>
    <link rel="stylesheet" href="/css/allplace.css">
</head>
<body>
<!-- 
    Search bar
    <header class="topbar">
        <input class="search" type="search" placeholder="⌕  search...">
    </header> -->

    <main class="page">

        <!-- Navigation -->
        <nav class="nav">
            <button class="back" onclick="history.back()">
                <a href="/html/afterhome.html">←</a>
            </button>
            <h1>Camping</h1>
            <button class="search-icon">⌕</button>
        </nav>

        <!-- Banner -->
        <section class="hero">
            <img src="https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?auto=format&fit=crop&w=1600&q=85"
                 alt="Camping">
        </section>

        <!-- Title -->
        <section class="intro">
            <h2>⛺ Camping</h2>
            <p>កន្លែង Camping ស្អាតៗ សម្រាប់សម្រាក និងផ្សងព្រេង</p>
        </section>

        <!-- Filters -->
        <section class="controls">
            <button class="filter active">All</button>
            <button class="filter">Popular</button>
            <button class="filter">Near Me</button>
            <button class="filter">Top Rated</button>

            <div class="sort-wrap">
                <select>
                    <option>Sort</option>
                    <option>Highest rating</option>
                    <option>Name A-Z</option>
                </select>
            </div>
        </section>

        <!-- Camping cards -->
        <section class="grid">

            <!-- Card 1 -->
            <article class="card">
                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?auto=format&fit=crop&w=900&q=80" alt="Lake camping">
                    <span class="rating">★ 4.8</span>
                </div>

                <div class="details">
                    <h3>📍 កន្លែងបោះតង់មាត់បឹង</h3>
                    <div class="location">📍 កម្ពុជា</div>
                    <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=camping+Cambodia" target="_blank">
                        📍 Google Map
                    </a>
                </div>
            </article>

            <!-- Card 2 -->
            <article class="card">
                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?auto=format&fit=crop&w=900&q=80" alt="Forest camping">
                    <span class="rating">★ 4.7</span>
                </div>

                <div class="details">
                    <h3>📍 បោះតង់ក្នុងព្រៃ</h3>
                    <div class="location">📍 កម្ពុជា</div>
                    <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=forest+camping+Cambodia" target="_blank">
                        📍 Google Map
                    </a>
                </div>
            </article>

            <!-- Card 3 -->
            <article class="card">
                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1475483768296-6163e08872a1?auto=format&fit=crop&w=900&q=80" alt="Family camping">
                    <span class="rating">★ 4.8</span>
                </div>

                <div class="details">
                    <h3>📍 កន្លែង Camping គ្រួសារ</h3>
                    <div class="location">📍 កម្ពុជា</div>
                    <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=family+camping+Cambodia" target="_blank">
                        📍 Google Map
                    </a>
                </div>
            </article>

            <!-- Card 4 -->
            <article class="card">
                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1504851149312-7a075b496cc7?auto=format&fit=crop&w=900&q=80" alt="Riverside camping">
                    <span class="rating">★ 4.7</span>
                </div>

                <div class="details">
                    <h3>📍 Camping មាត់ទឹក</h3>
                    <div class="location">📍 កម្ពុជា</div>
                    <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=riverside+camping+Cambodia" target="_blank">
                        📍 Google Map
                    </a>
                </div>
            </article>

        </section>
    </main>

</body>
</html>
