
<article class="tour-card">

    <div class="card-image">
        <img src="{{ card.image }}" alt="{{ card.name }}">
        <span class="card-tag">{{ card.category }}</span>
    </div>

    <div class="card-content">

        <h3>{{ card.name }}</h3>

        <p class="description">
            A comfortable hotel option offering rooms and facilities for travelers.
        </p>

        <div class="card-info">
            <span>
                <i class="fa-solid fa-location-dot"></i>
                {{ card.location }}
            </span>
        </div>

        <div class="card-bottom">
            <span class="price">Price: Check availability</span>
            <span class="rating">
                <i class="fa-solid fa-bed"></i>
            </span>
        </div>

        <details class="more-details">
            <summary>
                <span>See More</span>
                <i class="fa-solid fa-arrow-right"></i>
            </summary>
            <p>Contact the property to confirm prices and availability.</p>
        </details>

    </div>

</article>
