<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/login_style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div id="bg_login"></div>
    <div class="login_card">
        <div id="left_image">
            <img src="/images/login_bg.jpg" alt="">
        </div>

        <form class="form-box">
            <div>
                </div>
                <h1>Login</h1>
                <div id="em_user_Name">
                    <input id="E_Uname" type="text" name="email_Uname" placeholder="Email or User Name" required>
                    <i class='bx bx-user'></i>

                </div>
                <div id="password">
                    <input id="input_pass" type="text" name="password" placeholder="Password" required>
                    <i class='bx bx-lock'></i>
                </div>
                <div id="more">
                    <div>
                        <label>
                            <input type="checkbox" name="Remember_me" id="Re_me">
                            Remember Me
                        </label>
                    </div>
                    <div id="fpass">
                        <a href="#">Forget Password</a>
                    </div>
                </div>
                <button id="btnLogin" type="button">Login</button>
            </div>
        </form>
    </div>


    <script src="./javascript/login_event.js"></script>
</body>

</html>
